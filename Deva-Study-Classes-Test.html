}

.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.15rem; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: transparent; border: 1px solid rgba(255,255,255,.42); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
label, .lbl { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
input, select {
  width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; color: var(--fg);
  background: var(--field); border: 1px solid var(--line); border-radius: 10px;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { min-height: 48px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; min-height: 52px; padding: 12px 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--btn); color: var(--fg);
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
button:disabled { opacity: .45; cursor: default; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.meta { font-size: .85rem; color: var(--muted); }
#q-info { color: var(--fg); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.q { font-size: 1.1rem; font-weight: 600; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: flex-start; font-weight: 500; line-height: 1.4; }

/* Brand banner: orchid gradient that drifts, a light shine sweeping across, round stickers that pop in then float, wiggle or twinkle */
.brand { position: relative; overflow: hidden; border-radius: 18px; padding: 190px 16px 18px; text-align: center; color: #2e1040;
  background: linear-gradient(120deg, rgba(247,213,244,.20), rgba(217,181,248,.14), rgba(244,191,230,.20), rgba(247,213,244,.20)); background-size: 300% 300%;
  border: 1px solid rgba(255,255,255,.55);

.brand::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-18deg); animation: sweep 5.5s ease-in-out 1s infinite; }
.brand .name, .brand .tag { text-shadow: 0 2px 10px rgba(30,0,50,.9), 0 0 3px rgba(30,0,50,.9); }

.ch { position: relative; display: inline-block; visibility: hidden; }

@keyframes blink { 50% { opacity: 0; } }
.brand .name > span:nth-child(1) { color: #ffffff; animation-delay: .05s; }
.brand .name > span:nth-child(2) { color: #ecdcff; animation-delay: .25s; }

.plate { position: relative; z-index: 1; margin: 0 40px; padding: 0; }
.brand::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(28,8,44,.66), rgba(28,8,44,0) 58%); }
.brand .tag { position: relative; z-index: 1; margin-top: 6px; font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #fbeaff; }
.brand i { position: absolute; border-radius: 50%; background: rgba(255,255,255,.55); animation: floaty 6s ease-in-out infinite; }
.brand i:nth-of-type(1) { width: 60px; height: 60px; left: 30%; top: -34px; }
.brand i:nth-of-type(2) { width: 34px; height: 34px; right: 28%; bottom: -14px; animation-delay: -3s; }
.stk { position: absolute; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; line-height: 1;
  background: rgba(255,255,255,.8); box-shadow: 0 2px 6px rgba(120,40,140,.28);
  animation: pop .6s cubic-bezier(.3,1.6,.5,1) both, var(--mv) 4s ease-in-out .8s infinite; }
.stk.l { left: 9px; } .stk.r { right: 9px; }
.stk.a { top: 7%; } .stk.b { top: 38%; } .stk.c { top: 69%; }
.stk:nth-of-type(1) { --mv: floaty; animation-delay: .2s, .8s; }
.stk:nth-of-type(2) { --mv: wiggle; animation-delay: .35s, 1s; }
.stk:nth-of-type(3) { --mv: floaty; animation-delay: .5s, 1.2s; }
.stk:nth-of-type(4) { --mv: twinkle; animation-delay: .3s, .9s; }
.stk:nth-of-type(5) { --mv: floaty; animation-delay: .45s, 1.5s; }
.stk:nth-of-type(6) { --mv: wiggle; animation-delay: .6s, 1.1s; }
.logo { position: relative; z-index: 1; display: block; width: 104px; height: 104px; margin: 0 auto 12px; border-radius: 50%; object-fit: cover; border: 3px solid #fff;
  box-shadow: 0 0 0 3px #c77be0, 0 4px 12px rgba(120,40,140,.35); animation: pop .6s cubic-bezier(.3,1.6,.5,1) both, ring 3.2s ease-in-out 1.2s infinite; }
@keyframes ring { 0%, 100% { box-shadow: 0 0 0 3px #c77be0, 0 4px 12px rgba(120,40,140,.35); } 50% { box-shadow: 0 0 0 7px rgba(199,123,224,.45), 0 4px 16px rgba(120,40,140,.4); } }
@keyframes drift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.18) rotate(14deg); } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes sweep { 0% { left: -60%; } 55%, 100% { left: 130%; } }
@media (prefers-reduced-motion: reduce) {
  .brand, .brand i, .brand::after, .stk, .logo { animation: none; }
  .brand .name span, .brand .tag { animation: none; opacity: 1; }
}
textarea { width: 100%; padding: 10px 12px; font: inherit; font-size: .9rem; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 10px; resize: none; }
.btn { display: grid; place-items: center; min-height: 52px; padding: 12px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; text-align: center; background: var(--accent); color: var(--accent-fg); }

<script>

*/

  { q:"प्रकाश संश्लेषण क्रिया में ऑक्सीजन गैस निकलती है", o:["कार्बन डाइऑक्साइड से","जल से","वायु से","पर्ण हरित के विघटन से"], a:1 },

    var d = document.createElement("div"); d.className = "rv " + (ok ? "ok" : "no");
    var h = document.createElement("p"); h.className = "q"; h.textContent = (i + 1) + ". " + qt(q);
    var y = document.createElement("p"); y.className = "ans " + (ok ? "g" : "b");
    y.textContent = t.yours + (a < 0 ? t.none : qo(q)[a]);
    d.appendChild(h); d.appendChild(y);
    if (!ok) { var r = document.createElement("p"); r.className = "ans g"; r.textContent = t.right + qo(q)[q.a]; d.appendChild(r); }
    list.appendChild(d);
  });
  lastMsg = "Deva Study Classes\n" + t.mCode + ": " + codeLabel + "\n" + t.mName + ": " + (cfg.name || "-") + "\n" + t.mSub + ": " + cfg.subject + "\n" + t.mChap + ": " + (cfg.chapter || "-") + "\n" + t.mScore + ": " + c + " / " + n + " (" + pct + "%)\n" + t.correct + ": " + c + ", " + t.wrong + ": " + w + ", " + t.skipped + ": " + s;
  $("r-send-t").textContent = t.sendT; $("r-msg").value = lastMsg;
  $("r-wa").textContent = t.wa; $("r-copy").textContent = t.copy;
  $("r-wa").href = "https://wa.me/" + TEACHER_WA + "?text=" + encodeURIComponent(lastMsg);
  show("s-result");
}
$("r-copy").onclick = function () {

  } catch (e) { fallback(); }
};
function tryResume() {
  var h = store.get("dsc_active"), rec = null;

  enter();

/* Title typewriter: ek-ek character type hota hai, phir tag line */
(function () {
  var nameEl = $("brand-name"), tagEl = $("brand-tag"), chars = [], reduce = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  nameEl.textContent = ""; tagEl.textContent = "";
  function build(text, parent, delay) {
    for (var i = 0; i < text.length; i++) {
      var s = document.createElement("span"); s.className = "ch"; s.setAttribute("aria-hidden", "true");
      s.textContent = text.charAt(i) === " " ? "\u00a0" : text.charAt(i);
      parent.appendChild(s); chars.push({ el: s, d: delay });
    }
  }
  ["Deva", "Study", "Classes"].forEach(function (w) { var sp = document.createElement("span"); nameEl.appendChild(sp); build(w, sp, 130); });
  build("Science Practice Test", tagEl, 55);
  if (reduce) { chars.forEach(function (c) { c.el.classList.add("on"); }); return; }
  var i = 0, last = null;
  function step() {
    if (last) last.classList.remove("last");
    var c = chars[i]; c.el.classList.add("on", "last"); last = c.el; i++;
    if (i < chars.length) setTimeout(step, c.d + (chars[i].d !== c.d ? 450 : 0));
  }
  setTimeout(step, 400);
})();
